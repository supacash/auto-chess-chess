name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Pull requests run every check but never deploy (the deploy job and the Pages artifact are skipped).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One run per branch or PR, so a PR run never cancels a deploy from master.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The game's own engine (engine/, Rust → WASM). rustup reads the pinned toolchain from
      # engine/rust-toolchain.toml; the wasm-bindgen CLI must match the crate (scripts/build-engine.mjs).
      - run: rustup toolchain install
        working-directory: engine
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm run engine:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser smoke tests: whole runs in Chromium against the production build.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The same tests on a `fairy` build (Fairy-Stockfish, kept so the game can go back to it); built into
      # dist-fairy/, so dist/ stays the build that gets deployed.
      - run: npm run e2e:fairy
      # Firestore security rules and two-player online rooms, on the Firebase emulators (need Java).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run e2e:online
      # dist/ is what gets deployed: it must talk to the real Firebase project, never the emulators.
      - name: Check the build doesn't point at the emulators
        run: "! grep -rl '127.0.0.1:9099' dist"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
