name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Browser smoke tests: whole runs in Chromium against the production build.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Firestore security rules and two-player online rooms, on the Firebase emulators (need Java).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run e2e:online
      # dist/ is what gets deployed: it must talk to the real Firebase project, never the emulators.
      - name: Check the build doesn't point at the emulators
        run: "! grep -rl '127.0.0.1:9099' dist"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
