<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1f24" />
    <meta name="description" content="Draft and place a chess army; an engine plays the battle." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Auto Chess" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Auto Chess Chess</title>
    <!-- Cross-origin isolation for the multithreaded chess engine on hosts without COOP/COEP headers. -->
    <!-- Always use COEP require-corp: the default "credentialless" for non-Chromium browsers isn't
         supported by Safari, which then never becomes isolated. Everything here is same-origin. -->
    <script>
      window.coi = { coepCredentialless: () => false };
    </script>
    <script src="coi-serviceworker.min.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
